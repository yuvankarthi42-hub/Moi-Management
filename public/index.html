<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!--
    Pins the layout instead of allowing pinch-zoom, so the installed app
    behaves like an app rather than a zoomable page. `maximum-scale` /
    `user-scalable=no` is ignored by iOS Safari (by design, since iOS 10) — it
    takes effect on Android Chrome and desktop. Text still scales with the
    reader's own font-size setting either way, so this fixes the layout
    without locking out anyone who needs larger type.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>Moi Manager</title>
  <meta name="description" content="Every moi you receive and return, in one place." />

  <!-- PWA: installability (Android/Chrome) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#18095A" />

  <!--
    PWA: iOS home screen. Safari does not read the manifest above for any of
    this — each of these is read only from its own meta/link tag here, and
    only at install time: a change here needs the app removed from the home
    screen and added again.
  -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!--
    Opaque, not `black-translucent`. Translucent would let the purple header
    run under the status bar, but on iOS 26 (WebKit bug 301108) a home-screen
    app with a translucent status bar draws from the top edge yet gets a
    window one status bar *short* — and the missing strip lands at the bottom,
    as a blank band under the tab bar that no CSS or JS can paint into. With
    an opaque bar iOS reserves its own strip at the top and the window reaches
    the real bottom edge, so the tab bar sits on the home indicator as it
    should. `viewport-fit=cover` above still keeps the bottom inset.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Moi Manager" />

  <!-- The `react-native-web` recommended style reset:
       https://necolas.github.io/react-native-web/docs/setup/#root-element -->
  <style id="expo-reset">
    html, body, #root { height: 100%; }
    body { overflow: hidden; }
    #root { display: flex; flex: 1; }
  </style>
  <style>
    html, body, #root {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      margin: 0;
      /* Stops the double-tap-to-zoom gesture the viewport meta above cannot
         cover on its own. */
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
    /*
     * The layout box the installed iOS app actually fills.
     *
     * On iOS 26 (WebKit bug 301108) an installed home-screen app is handed a
     * window that is one status bar *short* of the real screen, and every
     * percentage-based height reflects that undersized window — `100%` on
     * html/body, `100vh`, `100dvh`, `innerHeight`, `visualViewport.height`.
     * The shortfall lands at the bottom as a blank band, no matter what
     * the status-bar style is set to and no matter what the safe-area
     * insets report.
     *
     * `position: fixed` with `inset: 0` sidesteps the entire percentage-height
     * chain: fixed positioning is resolved against the viewport itself, which
     * iOS sizes to the real screen. On every other browser and on native the
     * box was already the same shape, so this rule is inert. Applied to
     * `#root` alone (not html/body) so it never changes the stacking context
     * of anything else on the page.
     */
    #root {
      position: fixed;
      inset: 0;
    }
  </style>
</head>

<body>
  <!-- Use static rendering with Expo Router to support running without JavaScript. -->
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script>
    // Registered after load, and only on https or localhost — a service
    // worker cannot register anywhere else, and trying logs a scary-looking
    // error on every plain http preview for no benefit.
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          // Offline shell caching is a nicety. The app works without it.
        });
      });
    }
  </script>
</body>
</html>
